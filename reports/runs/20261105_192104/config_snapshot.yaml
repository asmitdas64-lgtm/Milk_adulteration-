class_weight: null
cv:
  n_splits: 5
  scoring: f1
  shuffle: true
data:
  column_rename:
    Colour: colour
    'Fat ': fat
    Grade: grade
    Odor: odor
    Taste: taste
    Temprature: temprature
    Turbidity: turbidity
    pH: ph
  features:
  - ph
  - temprature
  - taste
  - odor
  - fat
  - turbidity
  - colour
  label_mapping:
    high: 0
    low: 1
    medium: 1
  positive_label: 1
  ranges:
    colour:
    - 0.0
    - 300.0
    fat:
    - 0
    - 1
    odor:
    - 0
    - 1
    ph:
    - 0.0
    - 14.0
    taste:
    - 0
    - 1
    temprature:
    - 0.0
    - 100.0
    turbidity:
    - 0
    - 1
  raw_target: Grade
  target: label
features:
  corr_threshold: 0.9
  use_selected_subset: false
models:
  dt:
    grid:
      max_depth:
      - null
      - 3
      - 5
      - 7
      - 10
      - 15
      min_samples_split:
      - 2
      - 5
      - 10
      - 20
  gb:
    n_iter: 20
    random:
      learning_rate:
      - 0.01
      - 0.03
      - 0.05
      - 0.1
      - 0.2
      n_estimators:
      - 50
      - 100
      - 150
      - 200
      - 300
  knn:
    grid:
      metric:
      - euclidean
      - manhattan
      n_neighbors:
      - 1
      - 3
      - 5
      - 7
      - 9
      - 11
      - 13
      - 15
  rf:
    grid:
      max_depth:
      - null
      - 5
      - 10
      - 20
      min_samples_leaf:
      - 1
      - 2
      - 4
      n_estimators:
      - 100
      - 300
      - 500
  svm:
    grid:
      C:
      - 0.1
      - 1.0
      - 10.0
      - 100.0
      gamma:
      - scale
      - 0.001
      - 0.01
      - 0.1
      - 1.0
paths:
  interim: data/interim/clean.csv
  models_dir: models
  processed_dir: data/processed
  raw: data/raw/milknew.csv
  reports_dir: reports
preprocess:
  imputer: median
  iqr_factor: 1.5
  outliers: clip
  scaler: standard
random_state: 42
split:
  stratify: true
  test_size: 0.2
